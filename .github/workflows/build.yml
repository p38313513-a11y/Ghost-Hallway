name: Build Ghost Hallway PSP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build game
        run: make

      - name: Upload EBOOT
        uses: actions/upload-artifact@v4
        with:
          name: GhostHallway-EBOOT
          path: EBOOT.PBP
          if-no-files-found: error
